<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Room - Ratgal Janamastami 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">
    <!-- Simple Header -->
    <header class="bg-gray-800 text-white shadow-lg p-4 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-2 hover:text-yellow-400 transition text-gray-300">
            <i class="fa-solid fa-arrow-left"></i>
            <span class="font-bold text-sm">Exit Practice Room</span>
        </a>
        <h1 class="text-xl font-bold text-yellow-500 flex items-center gap-2">
            <i class="fa-solid fa-microphone-lines"></i> Volunteer Practice
        </h1>
        <div class="w-24"></div> <!-- Spacer for center alignment -->
    </header>



    <main class="max-w-4xl mx-auto px-4 py-12">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-white mb-2">Karaoke Practice</h2>
            <p class="text-gray-400">Play the videos below on your phone to practice the songs. No synchronization
                required.</p>
        </div>

        <div class="space-y-12">
            <!-- Video 1: Arambh Hai Prachand -->
            <div class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700">
                <h3 class="text-xl font-semibold text-yellow-400 mb-4 border-b border-gray-700 pb-2"><i
                        class="fa-solid fa-music mr-2"></i>Arambh Hai Prachand song</h3>
                <div class="rounded-xl overflow-hidden shadow-2xl bg-black">
                    <video controls class="w-full h-auto max-h-[60vh] object-contain" preload="metadata">
                        <source src="ahp-track.mp4" type="video/mp4">
                    </video>
                </div>
            </div>

            <!-- Video 2: Mahabharat new song -->
            <div class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700">
                <h3 class="text-xl font-semibold text-blue-400 mb-4 border-b border-gray-700 pb-2"><i
                        class="fa-solid fa-music mr-2"></i>Mahabharat new song</h3>
                <div class="rounded-xl overflow-hidden shadow-2xl bg-black">
                    <video controls class="w-full h-auto max-h-[60vh] object-contain" preload="metadata">
                        <source src="mim-track.mp4" type="video/mp4">
                    </video>
                </div>
            </div>

            <!-- Video 3: Mahabharat old song -->
            <div class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700">
                <h3 class="text-xl font-semibold text-green-400 mb-4 border-b border-gray-700 pb-2"><i
                        class="fa-solid fa-music mr-2"></i>Mahabharat old song</h3>
                <div class="rounded-xl overflow-hidden shadow-2xl bg-black">
                    <video controls class="w-full h-auto max-h-[60vh] object-contain" preload="metadata">
                        <source src="mhb-track.mp4" type="video/mp4">
                    </video>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
